name: build IPA

# Husk needs Xcode 26 (its JIT helper extension targets iOS 26), and the Mac it
# is developed on here is an Intel one capped at macOS 12, which cannot install
# it: the IPA is built on a runner and downloaded from the run's artifacts.
#
#   gh workflow run "build IPA"
#   gh run watch $(gh run list --workflow "build IPA" -L1 --json databaseId -q '.[0].databaseId')
#   gh run download --name Husk-ipa --dir ~/Desktop
#
# The build is the repository's own ./scripts/ci_build.sh -- QEMU, ANGLE,
# virglrenderer, MoltenVK, the guest kernel and the app, an hour or so from a
# cold runner. Three things the repository cannot build are staged before it,
# from the published Husk.ipa; see the step for why each one.
on:
  workflow_dispatch:

concurrency:
  group: build-ipa
  cancel-in-progress: false

jobs:
  ipa:
    name: Husk.ipa
    runs-on: macos-26
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: room on disk
        run: |
          echo "== before"; df -h /
          # The image ships several Xcodes (tens of gigabytes each) and the
          # simulator runtimes nothing here builds for: keep the selected SDKs
          # and drop the rest, or the build runs out of room partway.
          sel="$(cd "$(xcode-select -p)" && pwd -P | sed 's|/Contents/Developer$||')"
          for d in /Applications/Xcode*.app; do
            [ -e "$d" ] || continue
            [ "$(cd "$d" && pwd -P)" = "$sel" ] && continue
            echo "removing $d"
            sudo rm -rf "$d"
          done
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/*
          sudo rm -rf "$HOME/Library/Developer/CoreSimulator/Caches"/* || true
          echo "== after"; df -h /

      - name: tools the build scripts call
        run: |
          xcodebuild -version
          # qemu-img: the app's own build phase makes the firmware and userdata
          # seeds with it and stops with an error when it is missing.
          brew install meson xcodegen qemu
          # virglrenderer's meson build asks for a python3 with PyYAML, and the
          # meson the GPU script runs is Homebrew's, so Homebrew's python3 needs it.
          PY=/opt/homebrew/bin/python3
          "$PY" -m ensurepip --default-pip >/dev/null 2>&1 || true
          "$PY" -m pip install --break-system-packages --quiet pyyaml \
            || "$PY" -m pip install --quiet pyyaml
          "$PY" -c 'import yaml; print("pyyaml", yaml.__version__)'
          # libhusk_rppairing.a, the on-device pairing library for StikJIT.
          rustup target add aarch64-apple-ios
          meson --version; ninja --version; xcodegen --version; cargo --version
          command -v qemu-img

      - name: the pieces the repository cannot build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Three things ./scripts/ci_build.sh cannot produce, all of them from
          # sources or trees that are not here. They come from the published
          # Husk.ipa: none of them is code this branch changed, and naming them
          # is better than an IPA that builds, installs and then starts nothing.
          #
          #   java-runtime   build_java_runtime.sh wants the /apex directory of a
          #                  Lineage system image (Android's libcore, ICU,
          #                  conscrypt, tzdata, framework-res.apk). Without it no
          #                  game starts: the Dalvik runtime has no classes.
          #   android-system build_android_system.sh wants the same image (system
          #                  fonts, the trusted certificates).
          #   libhuskps4     build_ps4_ios.sh builds it from two working trees on
          #                  the author's Mac (Bachata-S4 on branch husk, husk-fex
          #                  on branch husk-fex), neither of which is a repository
          #                  this can clone. The PS4 layer, not the phone's own.
          gh release download --repo Leviidev/Husk --pattern Husk.ipa \
            --dir "$RUNNER_TEMP/rel" --clobber
          unzip -q "$RUNNER_TEMP/rel/Husk.ipa" -d "$RUNNER_TEMP/rel/x"
          APP="$RUNNER_TEMP/rel/x/Payload/Husk.app"
          rsync -a --delete "$APP/java-runtime/" build/java-runtime/
          rsync -a --delete "$APP/android-system/" build/android-system/
          mkdir -p build/ios-arm64/lib
          cp "$APP/Frameworks/libhuskps4.dylib" build/ios-arm64/lib/
          # Husk's own Java framework is the one exception: it is rebuilt from this
          # checkout, so the dex the app carries and the native side it talks to are
          # the same commit (package_ipa.sh refuses to package a mismatched one).
          curl -fsL -o "$RUNNER_TEMP/r8.jar" \
            https://storage.googleapis.com/r8-releases/raw/8.7.18/r8.jar
          HUSK_JDK="$(/usr/libexec/java_home)" HUSK_D8="$RUNNER_TEMP/r8.jar" \
            ./src/java-framework/build.sh build/java-runtime/husk-framework.dex
          ls -dh build/java-runtime build/android-system build/ios-arm64/lib/libhuskps4.dylib

      - name: QEMU, ANGLE, virglrenderer, MoltenVK, the guest kernel and the app
        run: ./scripts/ci_build.sh build/Husk.ipa
        timeout-minutes: 300

      # The artifact goes up before the check below, not after: a check that fails
      # on its own plumbing should not be what decides whether a built IPA can be
      # downloaded.
      - uses: actions/upload-artifact@v4
        with:
          name: Husk-ipa
          path: |
            build/Husk.ipa
            build/Husk.tipa
          if-no-files-found: error
          retention-days: 14

      - name: the IPA carries the fix and the runtime
        run: |
          set -euo pipefail
          unzip -q build/Husk.ipa -d "$RUNNER_TEMP/out"
          APP="$RUNNER_TEMP/out/Payload/Husk.app"
          # The streamed asset read is this branch's; no other Husk binary has this.
          # Into a file: grep -q closes the pipe on its first match, and strings
          # then exits non-zero with "failed to flush output".
          strings -a "$APP/Husk" > "$RUNNER_TEMP/husk.strings"
          grep -q TL_ZIP_TRIM_MB "$RUNNER_TEMP/husk.strings"
          # Without these the app installs, launches, and then cannot start a game.
          test -f "$APP/java-runtime/husk-framework.dex"
          test -f "$APP/java-runtime/framework-res.apk"
          test -d "$APP/android-system/fonts"
          for lib in libqemu-aarch64-softmmu.dylib libANGLE-shared.dylib libhuskps4.dylib; do
            test -f "$APP/Frameworks/$lib"
          done
          plutil -p "$APP/Info.plist" | grep -E "HuskBuildCommit|CFBundleShortVersionString"
          du -sh "$APP"
          echo "built from $(git rev-parse --short HEAD)"
