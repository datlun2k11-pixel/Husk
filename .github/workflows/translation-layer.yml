name: translation layer

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The zip layer is plain C over zlib, and its streaming test runs anywhere:
  # it builds an archive, streams a 256 MiB deflated entry out of it byte by
  # byte, and checks that the run never holds the entry in memory. It runs both
  # ways round: with the archive mapped whole, and (TL_ZIP_MAP_MAX_MB=0) with
  # every read a pread and a stored entry mapped on its own.
  zip-layer:
    name: asset streaming (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: zlib and zip
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev zip
      - name: build
        run: |
          clang -g -O1 -Wall -Wextra -D_DEFAULT_SOURCE \
            -I src/translation-layer -I src/translation-layer-next \
            tools/zipstream-test.c src/translation-layer/husk-tl-zip.c \
            -lz -o zipstream-test
      - name: run
        run: |
          ./zipstream-test                     # the archive mapped whole
          TL_ZIP_MAP_MAX_MB=0 ./zipstream-test # every read a pread

  # The network bridge reads the phone's own configuration -- the up interface, its netmask and broadcast address, the
  # MAC, the IPv4 default route out of it, and the resolvers. It is Darwin's own API (getifaddrs, the routing table
  # NET_RT_DUMP, res_ninit), so it is built and run here: the run checks the reading is coherent -- the address parses,
  # the netmask is one with the prefix it reports, the broadcast and the router are on the same network, and the way the
  # address is packed is the way Android's own APIs take it. A machine with nothing up still passes: the reading says so.
  network-bridge:
    name: network bridge (macos)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          clang -g -O1 -Wall -Wextra -D_DEFAULT_SOURCE \
            -I src/translation-layer -I src/translation-layer-next \
            tools/netcfg-test.c src/translation-layer-next/husk-tl-netcfg.c \
            -lresolv -o netcfg-test
      - name: run
        run: |
          ./netcfg-test                  # the switch's own default
          TL_NET_BRIDGE=1 ./netcfg-test  # as if Settings had turned it on
          TL_NET_BRIDGE=0 ./netcfg-test  # as if Settings had turned it off

  # macos-14 runs on arm64, which is what the layer's inline assembly, its JIT
  # calls and Darwin's thread-state structs need: an Intel machine cannot even
  # compile those files. This compiles exactly what tools/regress/build.sh
  # compiles -- same files, same flags -- plus the old loader's sources, which
  # the harness leaves out (and where tl_log_line lives, so the harness as it
  # stands cannot link at all); nothing is linked here on purpose.
  layer-compiles:
    name: the layer compiles (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: compile every source of the translation layer
        run: |
          T=src/translation-layer
          N=src/translation-layer-next
          mkdir -p "$RUNNER_TEMP/obj"
          fail=0
          for f in $N/*.c $N/*.m $T/*.c $T/*.m; do
            [ -e "$f" ] || continue
            case $f in *-unity-app.c) continue;; esac   # asks the app glue, as in tools/regress/build.sh
            clang -c -g -O1 -fobjc-arc -I$T -I$N \
              -Wno-unused-function -Wno-deprecated-declarations \
              "$f" -o "$RUNNER_TEMP/obj/$(basename "$f").o" || fail=1
          done
          exit $fail
