name: translation layer

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # The zip layer is plain C over zlib, and its streaming test runs anywhere:
  # it builds an archive, streams a 256 MiB deflated entry out of it byte by
  # byte, and checks that the run never holds the entry in memory.
  zip-layer:
    name: asset streaming (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: zlib and zip
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev zip
      - name: build
        run: |
          clang -g -O1 -Wall -Wextra -D_DEFAULT_SOURCE \
            -I src/translation-layer -I src/translation-layer-next \
            tools/zipstream-test.c src/translation-layer/husk-tl-zip.c \
            -lz -o zipstream-test
      - name: run
        run: ./zipstream-test

  # macos-14 runs on arm64, which is what the layer's inline assembly, its JIT
  # calls and Darwin's thread-state structs need: an Intel machine cannot even
  # compile those files. This compiles exactly what tools/regress/build.sh
  # compiles -- same files, same flags -- plus the old loader's sources, which
  # the harness leaves out (and where tl_log_line lives, so the harness as it
  # stands cannot link at all); nothing is linked here on purpose.
  layer-compiles:
    name: the layer compiles (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: compile every source of the translation layer
        run: |
          T=src/translation-layer
          N=src/translation-layer-next
          mkdir -p "$RUNNER_TEMP/obj"
          fail=0
          for f in $N/*.c $N/*.m $T/*.c $T/*.m; do
            [ -e "$f" ] || continue
            case $f in *-unity-app.c) continue;; esac   # asks the app glue, as in tools/regress/build.sh
            clang -c -g -O1 -fobjc-arc -I$T -I$N \
              -Wno-unused-function -Wno-deprecated-declarations \
              "$f" -o "$RUNNER_TEMP/obj/$(basename "$f").o" || fail=1
          done
          exit $fail
